[project]
name = "jenny-concert-backend"
version = "0.1.0"
description = "FastAPI backend for reading and updating concert data sourced from Apple Notes."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=1.68,<3.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
